# RailwayOne Pro — DEMO prototype stack.
#   docker compose up --build        → app on http://localhost:4000
#   docker compose up -d db          → only Postgres (for local `npm run dev`)
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: railway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-railway_dev_pw}
      POSTGRES_DB: railwayone
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railway -d railwayone"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://railway:${POSTGRES_PASSWORD:-railway_dev_pw}@db:5432/railwayone?schema=public
      # Required: provide your own long random value (see .env.example). Compose refuses to start without it.
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in your shell or a .env file next to docker-compose.yml}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-72}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_DEMO_EMAIL: ${SEED_DEMO_EMAIL:-demo@railwayone.dev}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-Demo@12345}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@railwayone.dev}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@12345}

volumes:
  pgdata:
